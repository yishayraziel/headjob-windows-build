name: HEADJOB Refined macOS
on:
  push:
    branches: [main, refined-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -nE 's/^project\(HEADJOB VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --config Release --target HEADJOB_AU HEADJOB_VST3 HEADJOBTests --parallel 4
      - name: DSP, gain and resize tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign, notarize and package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_CERT_APP_P12: ${{ secrets.MACOS_CERT_APP_P12 }}
          MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash installer/mac_package.sh
      - name: Install, validate and uninstall
        run: bash scripts/validate-macos.sh ${{ steps.package.outputs.signed == '1' && 'signed' || 'unsigned' }}
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: HEADJOB-Refined-${{ steps.version.outputs.version }}-macOS
          if-no-files-found: error
          path: out/*
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEADJOB-Refined-macOS-validation
          path: outputs/**
      - name: Publish signed build
        if: steps.package.outputs.signed == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: refined-latest
          target_commitish: ${{ github.sha }}
          name: HEADJOB Refined ${{ steps.version.outputs.version }} (latest signed Mac build)
          prerelease: true
          make_latest: false
          body: |
            Signed with Developer ID and notarized by Apple. Passed auval and pluginval strictness 5 on the build machine.
            Built from commit ${{ github.sha }}.
          files: out/*
